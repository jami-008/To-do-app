<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKFLOW</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header class="site-header">
            <div>
                <h1>TASKFLOW</h1>
                <p class="tagline">Stay organized. Get things done.</p>
            </div>
            <p class="header-count" id="header-count">0 tasks</p>
        </header>

        <section class="add-card" aria-labelledby="add-heading">
            <h2 id="add-heading" class="visually-hidden">Add a task</h2>
            <form id="todo-form" class="add-form">
                <label class="field title-field">
                    <span class="visually-hidden">Todo title</span>
                    <span class="title-input-wrap">
                        <span class="plus" aria-hidden="true">+</span>
                        <input type="text" id="todo-title" name="title" placeholder="What needs to be done..." maxlength="200" required>
                    </span>
                </label>

                <label class="field">
                    <span class="visually-hidden">Priority</span>
                    <select id="todo-priority" name="priority" aria-label="Priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </label>

                <label class="field">
                    <span class="visually-hidden">Due date</span>
                    <input type="date" id="todo-due-date" name="dueDate" aria-label="Due date">
                </label>

                <button type="submit" id="submit-btn" class="btn btn-primary">ADD</button>
            </form>
            <p id="form-error" class="form-error hidden" role="alert"></p>
        </section>

        <section class="stats" aria-label="Task statistics">
            <div class="stat-card">
                <span class="stat-label">TOTAL</span>
                <span id="count-total" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">ACTIVE</span>
                <span id="count-active" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">COMPLETED</span>
                <span id="count-completed" class="stat-value">0</span>
            </div>
        </section>

        <section class="toolbar" aria-label="Search and filters">
            <label class="search-field">
                <span class="visually-hidden">Search tasks</span>
                <input type="search" id="search-input" placeholder="Search" autocomplete="off">
            </label>
            <div class="filters" role="group" aria-label="Filter tasks">
                <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">ALL</button>
                <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">ACTIVE</button>
                <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">COMPLETED</button>
            </div>
        </section>

        <section class="todo-section" aria-labelledby="list-heading">
            <div class="list-header">
                <h2 id="list-heading">TODAY</h2>
                <button type="button" id="clear-completed-btn" class="btn btn-text">Clear completed</button>
            </div>
            <p id="list-status" class="visually-hidden" aria-live="polite"></p>
            <ul id="todo-list" class="todo-list"></ul>
            <div id="empty-state" class="empty-state hidden">
                <p id="empty-title" class="empty-title">No tasks yet</p>
                <p id="empty-copy" class="empty-copy">Add your first task above</p>
            </div>
        </section>

        <footer class="site-footer">
            <p id="remaining-count">0 tasks remaining</p>
            <p class="footer-note">Your tasks are saved locally in this browser.</p>
        </footer>
    </div>

    <div id="delete-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <div class="modal-backdrop" data-modal-dismiss="true"></div>
        <div class="modal-card">
            <h2 id="delete-modal-title">Delete task?</h2>
            <p>This action cannot be undone.</p>
            <div class="modal-actions">
                <button type="button" id="delete-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button type="button" id="delete-confirm-btn" class="btn btn-primary">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-relevant="additions"></div>

    <script src="js/app.js"></script>
</body>
</html>
